<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Sign in to NexusPro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coinbase: {
              blue: '#0052FF',
              blueHover: '#0045D8',
              lightBlue: '#EEF3FF',
              dark: '#0A0B0D',
              grayBg: '#F5F8FF',
              subtext: '#5B616E',
              border: '#ECEFF1'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="nexuspro-app.css">
  <style>
    body {
      background-color: #FFFFFF;
      color: #0A0B0D;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased bg-white select-none">

  <!-- Header with NexusPro Logo -->
  <header class="w-full px-6 py-6 sm:px-12 flex items-center justify-between border-b border-[#ECEFF1]">
    <a href="index.html" class="flex items-center gap-2">
      <svg class="w-9 h-9 text-coinbase-blue" fill="currentColor" viewBox="0 0 36 36">
        <path clip-rule="evenodd" d="M18 36C27.9411 36 36 27.9411 36 18C36 8.05887 27.9411 0 18 0C8.05887 0 0 8.05887 0 18C0 27.9411 8.05887 36 18 36ZM13.8 11.2C12.3641 11.2 11.2 12.3641 11.2 13.8V22.2C11.2 23.6359 12.3641 24.8 13.8 24.8H22.2C23.6359 24.8 24.8 23.6359 24.8 22.2V13.8C24.8 12.3641 23.6359 11.2 22.2 11.2H13.8Z" fill-rule="evenodd"></path>
      </svg>
      <span class="text-xl font-bold tracking-tight text-[#0052FF]">nexuspro</span>
    </a>
    <div class="text-xs text-[#5B616E] font-medium">
      Need help? <a href="#" onclick="openHelpModal()" class="text-coinbase-blue hover:underline font-semibold">Contact Support</a>
    </div>
  </header>

  <!-- Login Card Form Area -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[420px]">
      
      <div class="mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-[#0A0B0D] mb-2">Sign in to NexusPro</h1>
        <p class="text-sm text-[#5B616E]">Enter your email and password to access your portfolio and trades.</p>
      </div>

      <!-- Auth Toggle Tabs -->
      <div class="flex items-center bg-[#EEF0F3] p-1 rounded-full mb-6">
        <button id="tab-signin" onclick="switchAuthMode('signin')" class="flex-1 py-2 text-xs font-bold rounded-full bg-[#0A0B0D] text-white shadow-sm text-center transition-all">
          Sign In
        </button>
        <button id="tab-signup" onclick="switchAuthMode('signup')" class="flex-1 py-2 text-xs font-bold rounded-full text-[#5B616E] hover:text-[#0A0B0D] text-center transition-all">
          Create Account
        </button>
      </div>

      <!-- Error / Notice Banner -->
      <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-semibold"></div>

      <!-- Form Inputs -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        
        <!-- Full Name (Only visible for Create Account) -->
        <div id="fullname-container" class="hidden">
          <label class="block text-xs font-bold text-[#5B616E] uppercase tracking-wider mb-1.5" for="auth-fullname">Full Name</label>
          <input id="auth-fullname" type="text" placeholder="Full name" class="w-full px-4 py-3 rounded-2xl border border-[#ECEFF1] bg-[#F5F8FF]/50 focus:bg-white focus:border-coinbase-blue focus:ring-1 focus:ring-coinbase-blue text-sm font-medium text-[#0A0B0D] placeholder-gray-400 outline-none transition-all" />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-[#5B616E] uppercase tracking-wider mb-1.5" for="auth-email">Email Address</label>
          <input id="auth-email" type="email" required placeholder="Email address" value="" class="w-full px-4 py-3 rounded-2xl border border-[#ECEFF1] bg-[#F5F8FF]/50 focus:bg-white focus:border-coinbase-blue focus:ring-1 focus:ring-coinbase-blue text-sm font-medium text-[#0A0B0D] placeholder-gray-400 outline-none transition-all" />
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-[#5B616E] uppercase tracking-wider" for="auth-password">Password</label>
            <a href="#" onclick="showToast('Password Reset', 'Check your email inbox for instructions', '📧')" class="text-xs text-coinbase-blue hover:underline font-semibold">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="auth-password" type="password" required placeholder="••••••••••••" value="" class="w-full px-4 py-3 pr-12 rounded-2xl border border-[#ECEFF1] bg-[#F5F8FF]/50 focus:bg-white focus:border-coinbase-blue focus:ring-1 focus:ring-coinbase-blue text-sm font-medium text-[#0A0B0D] placeholder-gray-400 outline-none transition-all" />
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600">
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            </button>
          </div>
        </div>

        <!-- Primary Submit Button -->
        <button id="auth-submit-btn" type="submit" class="w-full py-4 mt-2 bg-[#0052FF] hover:bg-[#0045D8] active:scale-[0.99] text-white font-bold text-sm rounded-full transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
          <span>Sign In</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/></svg>
        </button>
      </form>
</div>

      <!-- Legal / Terms -->
      <p class="text-[11px] text-[#5B616E] text-center mt-6 leading-relaxed">
        By signing in, you agree to NexusPro's <a href="#" class="text-coinbase-blue underline">User Agreement</a> and <a href="#" class="text-coinbase-blue underline">Privacy Policy</a>.
      </p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full px-6 py-4 text-center text-xs text-[#5B616E] border-t border-[#ECEFF1]">
    © 2026 NexusPro, Inc. All rights reserved. Powered by Supabase Cloud.
  </footer>

  <!-- Supabase & App Engine SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="nexuspro-app.js"></script>

  <script>
    let authMode = 'signin';

    function switchAuthMode(mode) {
      authMode = mode;
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const fullnameContainer = document.getElementById('fullname-container');
      const submitBtnSpan = document.querySelector('#auth-submit-btn span');
      const alertBox = document.getElementById('auth-alert');
      alertBox.classList.add('hidden');

      if (mode === 'signup') {
        tabSignUp.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-[#0A0B0D] text-white shadow-sm text-center transition-all';
        tabSignIn.className = 'flex-1 py-2 text-xs font-bold rounded-full text-[#5B616E] hover:text-[#0A0B0D] text-center transition-all';
        fullnameContainer.classList.remove('hidden');
        submitBtnSpan.textContent = 'Create Free Account';
      } else {
        tabSignIn.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-[#0A0B0D] text-white shadow-sm text-center transition-all';
        tabSignUp.className = 'flex-1 py-2 text-xs font-bold rounded-full text-[#5B616E] hover:text-[#0A0B0D] text-center transition-all';
        fullnameContainer.classList.add('hidden');
        submitBtnSpan.textContent = 'Sign In';
      }
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('auth-password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    function showAlert(msg, isError = true) {
      const b = document.getElementById('auth-alert');
      b.classList.remove('hidden');
      b.className = isError
        ? 'mb-5 p-3.5 rounded-2xl text-xs font-semibold bg-rose-50 border border-rose-200 text-rose-700'
        : 'mb-5 p-3.5 rounded-2xl text-xs font-semibold bg-emerald-50 border border-emerald-200 text-emerald-700';
      b.textContent = msg;
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const fullname = document.getElementById('auth-fullname')?.value.trim();
      const submitBtn = document.getElementById('auth-submit-btn');

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70');

      try {
        const client = window.__supabase;
        
        if (authMode === 'signup') {
          if (client) {
            const { data, error } = await client.auth.signUp({
              email,
              password,
              options: { data: { full_name: fullname || 'Crypto Trader' } }
            });
            if (error) throw error;
            
            if (data && data.user) {
              await client.from('profiles').upsert([{
                id: data.user.id,
                email: email,
                name: fullname || email.split('@')[0],
                tier: 'Level 1 Verified',
                updated_at: new Date().toISOString()
              }]);
              await client.from('balances').upsert([{
                user_id: data.user.id,
                usd: 10000.00,
                btc: 0.00,
                eth: 0.00,
                sol: 0.00,
                doge: 0.00,
                updated_at: new Date().toISOString()
              }]);
            }
          }

          showAlert('Account created in Supabase! Loading portfolio...', false);
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);

        } else {
          if (client) {
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error) {
              console.warn('Supabase auth notice:', error.message);
            }
          }

          showAlert('Signed in successfully! Loading backend portfolio...', false);
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        }

      } catch (err) {
        showAlert('Authentication notice: ' + err.message, true);
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70');
      }
    }
      setTimeout(() => { window.location.href = 'index.html'; }, 500);
    }
  </script>
</body>
</html>
