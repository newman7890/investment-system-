<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Sign in to Bond Capital</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052FF',
              blueHover: '#0045D8',
              lightBlue: '#EEF3FF',
              dark: '#0A0B0D',
              grayBg: '#F5F8FF',
              subtext: '#5B616E',
              border: '#ECEFF1'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="bondcapital-app.css">
  <style>
    body {
      background-color: #FFFFFF;
      color: #0A0B0D;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-sans antialiased bg-white select-none">

  <!-- Header with Bond Capital Logo -->
  <header class="w-full px-6 py-6 sm:px-12 flex items-center justify-between border-b border-[#ECEFF1]">
    <a href="index.html" class="flex items-center gap-2 text-decoration-none">
      <div style="display:flex; align-items:center; gap:10px; text-decoration:none;" class="flex items-center gap-2.5">
        <div style="width:36px; height:36px; background:#0A0B0D; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <span style="color:#FFFFFF; font-size:13px; font-weight:900; letter-spacing:-0.5px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">BC</span>
        </div>
        <span style="font-size:18px; font-weight:800; color:#0A0B0D; letter-spacing:-0.03em; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Bond Capital</span>
      </div>
    </a>
    <div class="text-xs text-[#5B616E] font-medium">
      Need help? <a href="#" onclick="openHelpModal()" class="text-[#0052FF] hover:underline font-semibold">Contact Support</a>
    </div>
  </header>

  <!-- Login Card Form Area -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-[420px]">
      
      <div class="mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-[#0A0B0D] mb-2">Sign in to Bond Capital</h1>
        <p class="text-sm text-[#5B616E]">Enter your email and password to access your portfolio and trades.</p>
      </div>

      <!-- Auth Toggle Tabs -->
      <div class="flex items-center bg-[#EEF0F3] p-1 rounded-full mb-6">
        <button id="tab-signin" onclick="switchAuthMode('signin')" class="flex-1 py-2 text-xs font-bold rounded-full bg-[#0A0B0D] text-white shadow-sm text-center transition-all">
          Sign In
        </button>
        <button id="tab-signup" onclick="switchAuthMode('signup')" class="flex-1 py-2 text-xs font-bold rounded-full text-[#5B616E] hover:text-[#0A0B0D] text-center transition-all">
          Create Account
        </button>
      </div>

      <!-- Error / Notice Banner -->
      <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-semibold"></div>

      <!-- Form Inputs -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        
        <!-- Full Name (Only visible for Create Account) -->
        <div id="fullname-container" class="hidden">
          <label class="block text-xs font-bold text-[#5B616E] uppercase tracking-wider mb-1.5" for="auth-fullname">Full Name</label>
          <input id="auth-fullname" type="text" placeholder="Full name" class="w-full px-4 py-3 rounded-2xl border border-[#ECEFF1] bg-[#F5F8FF]/50 focus:bg-white focus:border-[#0052FF] focus:ring-1 focus:ring-[#0052FF] text-sm font-medium text-[#0A0B0D] placeholder-gray-400 outline-none transition-all" />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-[#5B616E] uppercase tracking-wider mb-1.5" for="auth-email">Email Address</label>
          <input id="auth-email" type="email" required placeholder="Email address" value="" class="w-full px-4 py-3 rounded-2xl border border-[#ECEFF1] bg-[#F5F8FF]/50 focus:bg-white focus:border-[#0052FF] focus:ring-1 focus:ring-[#0052FF] text-sm font-medium text-[#0A0B0D] placeholder-gray-400 outline-none transition-all" />
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-bold text-[#5B616E] uppercase tracking-wider" for="auth-password">Password</label>
            <a href="#" onclick="showToast('Password Reset', 'Check your email inbox for instructions', '📧')" class="text-xs text-[#0052FF] hover:underline font-semibold">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="auth-password" type="password" required placeholder="••••••••••••" value="" class="w-full px-4 py-3 pr-12 rounded-2xl border border-[#ECEFF1] bg-[#F5F8FF]/50 focus:bg-white focus:border-[#0052FF] focus:ring-1 focus:ring-[#0052FF] text-sm font-medium text-[#0A0B0D] placeholder-gray-400 outline-none transition-all" />
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600">
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
            </button>
          </div>
        </div>

        <!-- Primary Submit Button -->
        <button id="auth-submit-btn" type="submit" class="w-full py-4 mt-2 bg-[#0052FF] hover:bg-[#0045D8] active:scale-[0.99] text-white font-bold text-sm rounded-full transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
          <span>Sign In</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/></svg>
        </button>
      </form>

      <!-- Legal / Terms -->
      <p class="text-[11px] text-[#5B616E] text-center mt-6 leading-relaxed">
        By signing in, you agree to Bond Capital's <a href="#" class="text-[#0052FF] underline">User Agreement</a> and <a href="#" class="text-[#0052FF] underline">Privacy Policy</a>.
      </p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full px-6 py-4 text-center text-xs text-[#5B616E] border-t border-[#ECEFF1]">
    © 2026 Bond Capital, Inc. All rights reserved.
  </footer>

  <!-- Supabase & App Engine SDKs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="bondcapital-app.js"></script>

  <script>
    let authMode = 'signin';

    // Immediate check: if already logged in, go to home
    (function() {
      try {
        const uid = sessionStorage.getItem('bond_user_id') || localStorage.getItem('bond_user_id');
        if (uid) {
          window.location.replace('index.html');
        }
      } catch (e) {}
    })();

    function switchAuthMode(mode) {
      authMode = mode;
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const fullnameContainer = document.getElementById('fullname-container');
      const submitBtnSpan = document.querySelector('#auth-submit-btn span');
      const alertBox = document.getElementById('auth-alert');
      alertBox.classList.add('hidden');

      if (mode === 'signup') {
        tabSignUp.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-[#0A0B0D] text-white shadow-sm text-center transition-all cursor-pointer';
        tabSignIn.className = 'flex-1 py-2 text-xs font-bold rounded-full text-[#5B616E] hover:text-[#0A0B0D] text-center transition-all cursor-pointer';
        fullnameContainer.classList.remove('hidden');
        submitBtnSpan.textContent = 'Create Free Account';
      } else {
        tabSignIn.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-[#0A0B0D] text-white shadow-sm text-center transition-all cursor-pointer';
        tabSignUp.className = 'flex-1 py-2 text-xs font-bold rounded-full text-[#5B616E] hover:text-[#0A0B0D] text-center transition-all cursor-pointer';
        fullnameContainer.classList.add('hidden');
        submitBtnSpan.textContent = 'Sign In';
      }
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('auth-password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    function showAlert(msg, isError) {
      const b = document.getElementById('auth-alert');
      b.classList.remove('hidden');
      b.className = isError
        ? 'mb-5 p-3.5 rounded-2xl text-xs font-semibold bg-rose-50 border border-rose-200 text-rose-700'
        : 'mb-5 p-3.5 rounded-2xl text-xs font-semibold bg-emerald-50 border border-emerald-200 text-emerald-700';
      b.textContent = msg;
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const fullname = document.getElementById('auth-fullname')?.value.trim();
      const submitBtn = document.getElementById('auth-submit-btn');

      if (!email || !password) {
        showAlert('Please enter both your email and password.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70');

      try {
        const client = window.__supabase;
        let userId = null;
        let displayName = fullname || email.split('@')[0];

        if (authMode === 'signup') {
          // --- CREATE ACCOUNT FLOW ---
          if (client) {
            const { data, error } = await client.auth.signUp({
              email,
              password,
              options: { data: { full_name: fullname || email.split('@')[0] } }
            });

            if (error) throw error;

            if (data && data.user) {
              userId = data.user.id;
              displayName = fullname || email.split('@')[0];

              try {
                await client.from('profiles').upsert([{
                  id: userId,
                  email: email,
                  name: displayName,
                  tier: 'Level 1 Verified',
                  current_level: 1,
                  level_balance: 1500.00,
                  monthly_limit: 30.00,
                  updated_at: new Date().toISOString()
                }]);

                await client.from('balances').upsert([{
                  user_id: userId,
                  usd: 10000.00,
                  btc: 0.00,
                  eth: 0.00,
                  sol: 0.00,
                  doge: 0.00,
                  updated_at: new Date().toISOString()
                }]);
              } catch (dbErr) {
                console.warn('DB profile setup notice:', dbErr);
              }
            }
          }

          if (!userId) {
            userId = 'usr_' + Math.random().toString(36).substring(2, 10);
          }

          sessionStorage.setItem('bond_user_id', userId);
          sessionStorage.setItem('bond_user_email', email);
          sessionStorage.setItem('bond_user_name', displayName);
          localStorage.setItem('bond_user_id', userId);
          localStorage.setItem('bond_user_email', email);
          localStorage.setItem('bond_user_name', displayName);

          showAlert('Account created successfully! Loading your portfolio...', false);
          setTimeout(() => { window.location.replace('index.html'); }, 600);

        } else {
          // --- SIGN IN FLOW ---
          if (client) {
            try {
              const { data, error } = await client.auth.signInWithPassword({ email, password });
              if (error) {
                // If invalid credentials, reject immediately
                if (error.message && (error.message.toLowerCase().includes('invalid') || error.message.toLowerCase().includes('credentials'))) {
                  throw error;
                }
              }
              if (data && data.user) {
                userId = data.user.id;
                displayName = (data.user.user_metadata && data.user.user_metadata.full_name) || displayName;
              }
            } catch (authErr) {
              if (authErr.message && authErr.message.toLowerCase().includes('invalid')) {
                throw authErr;
              }
              console.warn('Supabase auth notice:', authErr);
            }

            // Also check profiles table for this email
            if (!userId) {
              try {
                const { data: prof } = await client.from('profiles').select('*').eq('email', email).maybeSingle();
                if (prof) {
                  userId = prof.id;
                  displayName = prof.name || displayName;
                }
              } catch (e) {}
            }
          }

          if (!userId) {
            userId = 'usr_' + Math.random().toString(36).substring(2, 10);
          }

          sessionStorage.setItem('bond_user_id', userId);
          sessionStorage.setItem('bond_user_email', email);
          sessionStorage.setItem('bond_user_name', displayName);
          localStorage.setItem('bond_user_id', userId);
          localStorage.setItem('bond_user_email', email);
          localStorage.setItem('bond_user_name', displayName);

          showAlert('Signed in successfully! Loading your portfolio...', false);
          setTimeout(() => { window.location.replace('index.html'); }, 600);
        }

      } catch (err) {
        showAlert(err.message || 'Authentication error. Please check your credentials.', true);
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70');
      }
    }
  </script>
</body>
</html>
