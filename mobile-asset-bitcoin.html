<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Bitcoin (BTC) - Coinbase</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cbBlue: '#0052FF',
            cbBlueHover: '#0045D8',
            cbRed: '#DF5F42',
            cbRedLight: '#FDF2F0',
            cbGrayText: '#5B616E',
            cbBorder: '#ECEFF0',
            cbSurface: '#F5F8FF',
            cbSubtleBg: '#EEF0F3'

          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- iOS System Status Bar Styling & Global Utility Styles -->
<style data-purpose="custom-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* Hide scrollbar for clean horizontal scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<link rel="stylesheet" href="coinbase-app.css">
</head>
<body class="bg-slate-100 flex justify-center items-start min-h-screen text-slate-900 font-sans antialiased">
<!-- Mobile Screen Shell (iOS Frame Adaptation ~390px) -->
<div class="w-full max-w-[430px] bg-white min-h-screen shadow-2xl relative flex flex-col pb-24 overflow-x-hidden">
<!-- BEGIN: TopNavigationBar -->
<!-- Native style iOS header with asset title and contextual controls -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
<div class="flex items-center space-x-2.5">

<button onclick="window.location.href='mobile-home.html'" aria-label="Go back" class="p-1 -ml-1 text-slate-700 hover:text-slate-900 transition-colors" type="button">

</button>

<div class="flex items-center space-x-1.5">
<h1 class="text-xl font-bold tracking-tight text-slate-900">Bitcoin</h1>
<button aria-label="Favorite asset" class="text-cbBlue hover:scale-110 transition-transform" type="button">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
</svg>
</button>
</div>
</div>
<!-- Action Icons (Search, Notifications, Profile) -->
<div class="flex items-center space-x-3.5">
<button aria-label="Search" class="text-slate-700 hover:text-slate-900 transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>

</button>
<button aria-label="Notifications" class="text-slate-700 hover:text-slate-900 transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Profile Avatar Placeholder -->
<div class="w-7 h-7 rounded-full bg-slate-700 text-white font-medium text-xs flex items-center justify-center cursor-pointer shadow-sm">
          C
        </div>
</div>
</header>
<!-- END: TopNavigationBar -->
<!-- BEGIN: PriceHeaderSection -->
<!-- Large prominent price typography with percentage change matching reference -->
<section class="px-5 pt-4 pb-2" data-purpose="price-header">

<div class="flex items-center space-x-1.5 mt-2 font-medium text-[15px] text-cbRed">
<!-- Downward Arrow Icon -->
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>$3,694.67 (-3.87%)</span>
</div>
</section>
<!-- END: PriceHeaderSection -->

<button class="py-1 px-3 rounded-full bg-slate-100 text-slate-900 font-bold shadow-xs" type="button">1D</button>
<button class="py-1 px-2.5 rounded-full hover:text-slate-800 transition-colors" type="button">1W</button>
<button class="py-1 px-2.5 rounded-full hover:text-slate-800 transition-colors" type="button">1M</button>
<button class="py-1 px-2.5 rounded-full hover:text-slate-800 transition-colors" type="button">1Y</button>
<button class="py-1 px-2.5 rounded-full hover:text-slate-800 transition-colors" type="button">ALL</button>
</div>

<svg class="w-full h-full" fill="none" preserveaspectratio="none" viewbox="0 0 390 150">

<stop offset="0%" stop-color="#DF5F42" stop-opacity="0.22"></stop>
<stop offset="80%" stop-color="#DF5F42" stop-opacity="0.04"></stop>
<stop offset="100%" stop-color="#DF5F42" stop-opacity="0.00"></stop>
</lineargradient>

<pattern height="6" id="dotPattern" patternunits="userSpaceOnUse" width="6">
<circle cx="1" cy="1" fill="#DF5F42" fill-opacity="0.2" r="0.75"></circle>
</pattern>
</defs>
<!-- Subtle patterned background matching desktop dots -->
<rect fill="url(#dotPattern)" height="80" opacity="0.6" width="390" y="70"></rect>
<!-- Filled gradient area under line -->
<path d="M 0,40

                   C 45,31 52,50 60,52
                   C 68,54 75,75 85,82
                   C 95,89 105,78 115,95

                   C 155,98 165,114 175,112
                   C 185,110 195,122 205,138
                   C 215,125 225,115 235,112
                   C 245,110 255,108 265,116
                   C 275,124 285,116 295,114
                   C 305,112 315,115 325,113
                   C 335,111 345,116 355,122
                   C 365,128 375,114 390,115
                   L 390,150 L 0,150 Z" fill="url(#chartGradient)"></path>
<!-- Downward trending Bitcoin price stroke line -->
<path d="M 0,40
                   C 15,38 25,25 35,28
                   C 45,31 52,50 60,52
                   C 68,54 75,75 85,82
                   C 95,89 105,78 115,95
                   C 125,112 135,118 145,108
                   C 155,98 165,114 175,112
                   C 185,110 195,122 205,138
                   C 215,125 225,115 235,112
                   C 245,110 255,108 265,116
                   C 275,124 285,116 295,114
                   C 305,112 315,115 325,113
                   C 335,111 345,116 355,122
                   C 365,128 375,114 390,115" fill="none" stroke="#DF5F42" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</div>
<!-- Time Axis Labels underneath graph -->
<div class="flex justify-between items-center px-4 pt-1 text-[11px] text-slate-400 font-medium tracking-tight">
<span>6:35 PM</span>
<span>11:55 PM</span>
<span>5:15 AM</span>
<span>10:35 AM</span>
<span>3:55 PM</span>
</div>

<!-- END: InteractivePriceChart -->
<!-- BEGIN: TabsSegment -->
<!-- Segmented tabs: Balance (active) and Insights -->
<div class="px-5 mt-5 border-b border-gray-100 flex space-x-6 text-[15px] font-semibold">
<button class="pb-2.5 text-cbBlue border-b-2 border-cbBlue" type="button">
        Balance
      </button>
<button class="pb-2.5 text-slate-500 hover:text-slate-800 transition-colors" type="button">
        Insights
      </button>
</div>
<!-- END: TabsSegment -->
<!-- BEGIN: BalanceSummaryCard -->
<!-- Balance breakdown displaying current Bitcoin holding -->
<section class="px-5 py-4 flex items-center justify-between" data-purpose="balance-card">

<!-- Bitcoin Gold Avatar Badge -->
<div class="w-10 h-10 rounded-full bg-[#F7931A] text-white flex items-center justify-center font-bold text-xl shadow-xs">
          ₿
        </div>
<div>
<div class="text-[17px] font-bold text-slate-900 leading-tight">$0.00</div>
<div class="text-xs text-slate-500 font-medium">0 BTC</div>
</div>
</div>
<button class="text-xs font-semibold text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full transition-colors" type="button">

      </button>
</section>
<!-- END: BalanceSummaryCard -->
<hr class="border-gray-100 mx-5 my-1"/>
<!-- BEGIN: MobileOrderWidget -->
<!-- Interactive Trade Form translated from right sidebar of the desktop view -->
<section class="px-5 pt-3 pb-6 flex-1 flex flex-col justify-between" data-purpose="order-form">
<div>
<!-- Order Type Segmented Switcher (Buy / Sell / Convert) -->
<div class="flex items-center space-x-1.5">
<button class="bg-black text-white text-xs font-semibold px-4 py-1.5 rounded-full" type="button">
            Buy
          </button>
<button class="text-slate-600 hover:text-black text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-slate-100 transition-colors" type="button">
            Sell
          </button>
<button class="text-slate-600 hover:text-black text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-slate-100 transition-colors" type="button">
            Convert
          </button>
</div>
<!-- Frequency Selector Dropdown -->
<div class="mt-3.5 inline-block">
<button class="inline-flex items-center space-x-1.5 text-xs font-semibold text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full transition-colors" type="button">
<span>One-time order</span>
<svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
<!-- Amount Input Display with Currency and Max badge -->
<div class="mt-6 text-center relative py-2">
<div class="flex items-baseline justify-center">
<span class="text-6xl font-bold tracking-tight text-slate-900">0</span>
<span class="text-5xl font-light text-slate-300 ml-1">USD</span>
</div>
<!-- Max Trigger Pill -->
<div class="absolute right-1 top-2">
<button class="text-xs font-semibold text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded-full transition-colors" type="button">

            </button>
</div>

<div class="flex items-center justify-center space-x-1 mt-2 text-cbBlue text-xs font-semibold">
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>0 BTC</span>
</div>
</div>
<!-- Payment Method Row Item -->
<div class="mt-6 border border-gray-100 rounded-2xl p-3.5 flex items-center justify-between hover:bg-slate-50 transition-colors cursor-pointer">
<div class="flex items-center space-x-3">
<div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center">

<div>
<div class="text-xs font-semibold text-slate-500">Pay with</div>

<div class="flex items-center space-x-2">
<div class="text-right">
<div class="text-xs font-bold text-slate-900">$1.15</div>
<div class="text-[11px] text-slate-400">Available</div>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Target Asset Row Item -->
<div class="mt-2.5 border border-gray-100 rounded-2xl p-3.5 flex items-center justify-between hover:bg-slate-50 transition-colors cursor-pointer">
<div class="flex items-center space-x-3">
<div class="w-9 h-9 rounded-full bg-[#F7931A] text-white font-bold text-base flex items-center justify-center">
              ₿
            </div>
<div>
<div class="text-xs font-semibold text-slate-500">Buy</div>
<div class="text-sm font-bold text-slate-900">Bitcoin</div>
</div>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Main Action Button: Review order -->
<div class="mt-6">
<button class="w-full bg-cbBlue hover:bg-cbBlueHover active:scale-[0.99] text-white font-bold text-base py-3.5 px-6 rounded-full flex items-center justify-center space-x-2 shadow-sm transition-all" type="button">
<span>Review order</span>
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</section>
<!-- END: MobileOrderWidget -->
<!-- BEGIN: BottomNavigationBar -->

<nav class="fixed bottom-0 w-full max-w-[430px] bg-white/95 backdrop-blur-md border-t border-gray-200 px-3 py-2 z-50 flex items-center justify-around text-slate-500" data-purpose="bottom-tab-bar">
<!-- Home Tab -->
<button onclick="window.location.href='mobile-home.html'" class="flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-900 transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">

<path d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium">Trade</span>
</button>

<button class="flex flex-col items-center justify-center w-14 py-1 text-slate-400 hover:text-slate-900 transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-.778.099-1.533.284-2.253" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium">Explore</span>
</button>

<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10px] mt-1 font-medium">More</span>
</button>
</nav>

</div>
