  <!-- Authentication Route Guard -->
  <script>
    (function() {
      try {
        var uid = sessionStorage.getItem('bond_user_id') || localStorage.getItem('bond_user_id');
        var hasSbToken = false;
        for (var k in localStorage) {
          if (k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) { hasSbToken = true; break; }
        }
        if (!uid && !hasSbToken) {
          window.location.replace('login.html');
        }
      } catch (e) {}
    })();
  </script>
