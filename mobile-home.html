<!DOCTYPE html>

  <!-- Authentication Route Guard -->
  <script>
    (function() {
      try {
        var uid = sessionStorage.getItem('bond_user_id') || localStorage.getItem('bond_user_id');
        var hasSbToken = false;
        for (var k in localStorage) {
          if (k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) { hasSbToken = true; break; }
        }
        if (!uid && !hasSbToken) {
          window.location.replace('login.html');
        }
      } catch (e) {}
    })();
  </script>

<script>
  /* Avatar early-init: set initial letter before main JS loads to prevent flicker */
  (function() {
    try {
      var name = sessionStorage.getItem('bond_user_name') || localStorage.getItem('bond_user_name') || '';
      var email = sessionStorage.getItem('bond_user_email') || localStorage.getItem('bond_user_email') || '';
      var initial = (name || email || 'U').trim().charAt(0).toUpperCase();
      document.querySelectorAll('button[aria-label="Profile Avatar"], button[aria-label="User Profile"], button[onclick*="openProfileModal"]').forEach(function(btn) {
        if (!btn.querySelector('svg') && !btn.querySelector('img')) btn.textContent = initial;
      });
    } catch(e) {}
  })();
</script>
